[package]
name = "arrs-cli"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
description = "Command-line tool for inspecting Lance and other Arrow-based datasets."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/jonasdedden/arrs"
documentation = "https://docs.rs/arrs-cli"
repository = "https://github.com/jonasdedden/arrs"

[lib]
name = "arrs"
path = "src/lib.rs"

[[bin]]
name = "arrs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
arrow = { version = "57", features = ["prettyprint"] }
arrow-array = "57"
arrow-cast = "57"
arrow-schema = "57"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
csv = "1.4.0"
futures = "0.3.32"
# `aws`/`gcp`/`azure` enable object_store backends for s3://, gs:// and az://
# URIs. They are part of lance's default feature set, so listing them here is a
# deliberate no-op that pins remote support even if defaults ever change; it
# adds no binary size over the stock defaults.
lance = { version = "4.0.0", features = ["aws", "gcp", "azure"] }
lance-index = "4"
rand = "0.10.1"
rand_chacha = "0.10.0"
serde_json = { version = "1.0.149", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "fs", "io-std", "io-util"] }

[dev-dependencies]
lance-linalg = "4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
