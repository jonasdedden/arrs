name: Release

# Triggered by pushing an annotated tag matching `v*` (e.g. v0.1.0,
# v0.2.0-rc1). Also exposes a `workflow_dispatch` button so a
# release-engineer can rebuild artifacts for an existing tag without
# re-pushing it (useful when a runner died mid-matrix).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref / tag to build (e.g. v0.1.0)"
        required: true
        type: string

# Cancel a duplicate run targeting the same tag (e.g. tag re-pushed).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Linux: manylinux2014 base (glibc 2.17) — covers CentOS 7+, Ubuntu
  # 18.04+, Debian 10+. PyO3/maturin-action runs maturin inside the
  # appropriate manylinux container so the wheel auditwheel-tag is
  # set correctly.
  # ──────────────────────────────────────────────────────────────────
  linux:
    name: linux · ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Use hardcoded version numbers for now - skipping manually setting version numbers
      # - name: Sync workspace + pyproject version to tag
      # run: python3 tools/set_version_from_tag.py "${{ inputs.ref || github.ref }}"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release --out dist
          # The manylinux2014 image (CentOS-7-based) doesn't ship protoc
          before-script-linux: |
            yum install -y protobuf-compiler || dnf install -y protobuf-compiler
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # macOS: x86_64 (Intel) + arm64 (Apple Silicon). The `macos-13`
  # runner is x86_64, `macos-14` is arm64.
  # ──────────────────────────────────────────────────────────────────
  macos:
    name: macos · ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runs-on: macos-13
          - target: aarch64
            runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # `arduino/setup-protoc` has no Node-24 release, which prints
      # a deprecation warning. Homebrew already has protoc and is
      # cached on macOS runners, so just install it directly.
      - run: brew install protobuf
      # Use hardcoded version numbers for now - skipping manually setting version numbers
      # - name: Sync workspace + pyproject version to tag
      # run: python3 tools/set_version_from_tag.py "${{ inputs.ref || github.ref }}"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}-apple-darwin
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Source distribution. Platform-independent, but we run on Linux
  # for fastest spin-up. Same artifact contains the sdist tarball.
  # ──────────────────────────────────────────────────────────────────
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Use hardcoded version numbers for now - skipping manually setting version numbers
      # - name: Sync workspace + pyproject version to tag
      # run: python3 tools/set_version_from_tag.py "${{ inputs.ref || github.ref }}"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # GitHub Release: attach every wheel + sdist as release assets.
  # The release is created in `draft` mode by default — release-eng
  # reviews the artifact list and publishes manually. Skips on a
  # workflow_dispatch run because that's typically a re-build, not a
  # re-publish.
  # ──────────────────────────────────────────────────────────────────
  github-release:
    name: github release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release with attachments
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          generate_release_notes: true

  # ──────────────────────────────────────────────────────────────────
  # PyPI publish (trusted publishing). Disabled by default — uncomment
  # AFTER configuring https://pypi.org/manage/account/publishing/ for
  # this repo. Trusted publishing requires no API token: PyPI verifies
  # the OIDC token GitHub mints and matches it against the configured
  # repo + workflow + environment triple.
  # ──────────────────────────────────────────────────────────────────
  # pypi:
  #   name: publish to PyPI
  #   needs: verify
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   runs-on: ubuntu-latest
  #   environment:
  #     name: pypi
  #     url: https://pypi.org/p/rayd
  #   permissions:
  #     id-token: write   # OIDC token for trusted publishing
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         path: dist
  #         merge-multiple: true
  #     - uses: pypa/gh-action-pypi-publish@release/v1
  #       with:
  #         packages-dir: dist
  #         skip-existing: true
